# Reserved — local dev infrastructure
# Spuštění: docker compose -f docker-compose.dev.yml up -d
# Ukončení: docker compose -f docker-compose.dev.yml down
# Reset:    docker compose -f docker-compose.dev.yml down -v
#
# Porty: Postgres 5433 (5432 bývá obsazený jinými projekty), Mailhog SMTP 1026 / UI 8026.
# Redis se nepoužívá (fronty = Postgres polling v apps/workers), proto tu není.
#
# Init skripty v packages/db/init se spustí jen při prvním startu nového volume
# (vytvoří mj. testovací DB reserved_test).

services:
  postgres:
    image: postgres:16-alpine
    container_name: reserved-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: reserved_dev
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./packages/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dev -d reserved_dev']
      interval: 5s
      timeout: 5s
      retries: 5

  mailhog:
    image: mailhog/mailhog:latest
    container_name: reserved-mailhog
    restart: unless-stopped
    ports:
      - '1026:1025' # SMTP (host 1026 — tixly-mailhog drží 1025)
      - '8026:8025' # Web UI: http://localhost:8026

volumes:
  postgres_data:
    # Nový volume (v2) — starý `reserved_postgres_data` se záměrně nepoužívá ani nemaže.
    name: reserved_postgres_data_v2

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Ruční spuštění z Actions → CI → Run workflow. Pozor: GitHub bere jako ref jen
  # jméno větve nebo tagu, ne commit SHA — na konkrétní commit si udělej tag.
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: reserved_test
          POSTGRES_USER: dev
          POSTGRES_PASSWORD: dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dev -d reserved_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Migrace a DB testy jako vlastník (dev), běžící API jako app_user (RLS).
      DATABASE_URL: postgresql://dev:dev@localhost:5432/reserved_test
      DATABASE_APP_URL: postgresql://app_user:reserved_ci_app_2026@localhost:5432/reserved_test
      JWT_SECRET: ci_test_secret_at_least_32_characters_long_xxxxxxxx
      JWT_ISSUER: reserved
      JWT_AUDIENCE: reserved-api
      API_PORT: 4010
      APP_URL: http://localhost:4002
      # Heslo role app_user — migrace ho vyžaduje (bez něj skončí chybou) a musí
      # se shodovat s heslem v DATABASE_APP_URL výše.
      # Musí mít aspoň 12 znaků — migrace kratší heslo odmítne.
      APP_USER_PASSWORD: reserved_ci_app_2026
      # Klíč pro šifrování přístupů k platebním bránám (32 B = 64 hex znaků).
      # Testovací hodnota, v produkci se generuje: openssl rand -hex 32
      #
      # POZOR — UVOZOVKY JSOU POVINNÉ. Dřív tu bylo 64 jedniček bez uvozovek a
      # YAML je přečetl jako ČÍSLO: do prostředí se dostalo "1.11111111111111E+63",
      # tedy 14 bajtů místo 32, a API kvůli tomu vůbec nenastartovalo. Hodnota
      # proto obsahuje i písmena (jako číslo se přečíst nedá) a je v uvozovkách.
      PAYMENT_CONFIG_KEY: 'a1b2c3d4e5f60718293a4b5c6d7e8f90a1b2c3d4e5f60718293a4b5c6d7e8f90'
      # API_URL záměrně NEnastavujeme: API ho používá jako vlastní base URL (bez /api/v1),
      # testy mají správný default http://localhost:4010/api/v1.

    steps:
      - uses: actions/checkout@v7

      # Verze pnpm se bere z package.json (packageManager) — nezadávat ji tady znovu.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: DB migrace (prázdná DB → všech 86)
        run: pnpm db:migrate

      # Seed je potřeba pro testy, které ověřují demo data (např. že existujícím
      # účtům ze seedu nic nerozbilo ověřování e-mailu). Navíc tím CI hlídá, že
      # seed na čisté DB vůbec projede — to se dřív netestovalo a už dvakrát se
      # kvůli tomu rozbil (chybějící import, zúžení typu ve vnořené funkci).
      - name: DB seed (demo + fitness tenant)
        run: pnpm db:seed

      # Produkční běh: node dist/main.js. Balíčky @reserved/* exportují sestavený dist,
      # takže API jde spustit čistým Nodem bez tsx.
      - name: Start API z dist (produkční build)
        run: |
          pnpm --filter @reserved/api start > /tmp/api.log 2>&1 &
          echo $! > /tmp/api.pid
        env:
          NODE_ENV: production

      - name: Ověřit health API z dist (max 60 s)
        run: |
          for i in {1..60}; do
            if curl -fs http://localhost:4010/api/v1/health > /dev/null 2>&1; then
              echo "API běží po ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "API nenaběhlo do 60 s"
          cat /tmp/api.log
          exit 1

      # Unit + DB-integrační testy všech balíčků. Full-stack E2E běží v e2e-smoke.yml.
      - name: Test
        run: pnpm turbo run test --filter='!@reserved/e2e'

      - name: Logy API při selhání
        if: failure()
        run: cat /tmp/api.log || true

      - name: Zastavit API
        if: always()
        run: |
          if [ -f /tmp/api.pid ]; then
            kill $(cat /tmp/api.pid) 2>/dev/null || true
          fi

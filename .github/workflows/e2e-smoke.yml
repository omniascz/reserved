name: E2E Smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  e2e-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: reserved_test
          POSTGRES_USER: dev
          POSTGRES_PASSWORD: dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dev -d reserved_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      API_PORT: 4010
      APP_URL: http://localhost:4002
      # Migrace jako vlastník (dev); API běží jako app_user (roli vytvoří migrace 0003).
      DATABASE_URL: postgresql://dev:dev@localhost:5432/reserved_test
      DATABASE_APP_URL: postgresql://app_user:app@localhost:5432/reserved_test
      DATABASE_POOL_MAX: 10
      JWT_SECRET: ci_smoke_test_secret_at_least_32_characters_long_xxxx
      JWT_ISSUER: reserved
      JWT_AUDIENCE: reserved-api
      APP_BASE_DOMAIN: localhost
      SMTP_HOST: localhost
      SMTP_PORT: 1025
      EMAIL_FROM: noreply@reserved.local
      EMAIL_FROM_NAME: Reserved CI
      # API_URL záměrně NEnastavujeme: API ho používá jako vlastní base URL (bez /api/v1),
      # E2E testy mají správný default http://localhost:4010/api/v1.

    steps:
      - uses: actions/checkout@v7

      # Verze pnpm se bere z package.json (packageManager).
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: DB migrace (prázdná DB → všech 85)
        run: pnpm db:migrate

      # DOČASNĚ přes tsx: `node dist/main.js` zatím nejde spustit, protože balíčky
      # @reserved/* exportují TS zdrojáky (packages/*/package.json -> src/index.ts).
      # Rozhodnutí o produkčním startu čeká (viz PR popis).
      - name: Start API na pozadí
        run: |
          pnpm --filter @reserved/api exec tsx src/main.ts > /tmp/api.log 2>&1 &
          echo $! > /tmp/api.pid
        env:
          NODE_ENV: production

      - name: Počkat na API (max 60 s)
        run: |
          for i in {1..60}; do
            if curl -fs http://localhost:4010/api/v1/health > /dev/null 2>&1; then
              echo "API běží po ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "API nenaběhlo do 60 s"
          echo "─── API logs ───"
          cat /tmp/api.log
          exit 1

      - name: E2E smoke testy
        run: pnpm --filter @reserved/e2e test

      - name: Logy API při selhání
        if: failure()
        run: |
          echo "─── API logs ───"
          cat /tmp/api.log || true

      - name: Zastavit API
        if: always()
        run: |
          if [ -f /tmp/api.pid ]; then
            kill $(cat /tmp/api.pid) 2>/dev/null || true
          fi
